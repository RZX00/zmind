name: DCO Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-dco:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Signed-off-by trailers
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 250,
            });

            const unsigned = commits.filter(({ commit }) =>
              !/^Signed-off-by:\s+.+<.+>\s*$/im.test(commit.message)
            );

            if (unsigned.length > 0) {
              core.setFailed(
                `Every commit must include a Signed-off-by trailer. Missing: ${unsigned
                  .map(({ sha }) => sha.slice(0, 7))
                  .join(', ')}. Amend with: git commit --amend -s --no-edit`
              );
            }
