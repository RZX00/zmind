# =============================================================================
# zmind 数据层内部网关
#
# 把 Supabase 云的 URL 形状原样复刻出来，这样 supabase-py / supabase-js 一行代码
# 都不用改，只改 SUPABASE_URL 指向这里：
#
#   /rest/v1/<table>  ->  postgrest:3000/<table>
#   /auth/v1/<path>   ->  gotrue:9999/<path>
#
# 两个上游各自会发 CORS 头，nginx 不要再加，否则浏览器会因为重复的
# Access-Control-Allow-Origin 直接拒绝响应。
# =============================================================================

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # SSE / 长响应不缓冲
    proxy_buffering off;
    proxy_http_version 1.1;

    # 上传/大 payload：画布 JSON 可能很大
    client_max_body_size 64m;

    access_log off;
    error_log  /var/log/nginx/error.log warn;

    upstream postgrest_upstream {
        server rest:3000;
        keepalive 32;
    }

    upstream gotrue_upstream {
        server auth:9999;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;

        # 宿主/compose 健康检查用，不碰上游
        location = /health {
            add_header Content-Type application/json always;
            return 200 '{"status":"ok"}';
        }

        # ---------------------------------------------------------------------
        # PostgREST
        # 末尾斜杠 + $1 的写法把 /rest/v1 前缀剥掉：PostgREST 自身服务在根路径。
        # ---------------------------------------------------------------------
        location ~ ^/rest/v1/?(.*)$ {
            proxy_pass http://postgrest_upstream/$1$is_args$args;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # supabase-py/js 会带 apikey 头，PostgREST 不认识它但也无害；
            # 真正的鉴权走 Authorization: Bearer <jwt>，由 PGRST_JWT_SECRET 校验。
        }

        # ---------------------------------------------------------------------
        # GoTrue
        #
        # ⚠️ 必须由网关代答 CORS 预检。
        # GoTrue 自己对 OPTIONS 只回 204、不带任何 CORS 头（已直连容器实测确认）；
        # 在 Supabase 云上这一步是 Kong 网关做的，自托管少了 Kong 就没人做。
        # 后果是浏览器对 /auth/v1/* 的所有调用全被拦死 —— 表现为登出点了没反应、
        # Google 登录回调后拿不到会话，而服务端日志一切正常（因为请求根本没发出来）。
        #
        # 只在 OPTIONS 上加头：真实请求的 CORS 头由 GoTrue 自己发
        # （Access-Control-Allow-Origin: *），这里再加一遍会变成重复头，浏览器同样拒绝。
        # ---------------------------------------------------------------------
        location ~ ^/auth/v1/?(.*)$ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      "*"      always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                # 这几个头是 supabase-js 会带的，少一个浏览器就判预检失败
                add_header Access-Control-Allow-Headers     "Authorization, authorization, apikey, X-Client-Info, x-client-info, X-Supabase-Api-Version, x-supabase-api-version, Content-Type, Accept, Accept-Language, Content-Language, X-Workspace-Id" always;
                add_header Access-Control-Expose-Headers    "X-Total-Count, Link, X-Supabase-Api-Version" always;
                add_header Access-Control-Max-Age           86400    always;
                add_header Content-Length                   0;
                add_header Content-Type                     "text/plain charset=UTF-8";
                return 204;
            }

            proxy_pass http://gotrue_upstream/$1$is_args$args;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        location / {
            add_header Content-Type application/json always;
            return 404 '{"error":"not found","hint":"only /rest/v1 and /auth/v1 are served here"}';
        }
    }
}
