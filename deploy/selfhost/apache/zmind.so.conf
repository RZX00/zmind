# =============================================================================
# zmind.so —— 前端 (Next.js)
#
# 原生 Apache vhost，不走宝塔面板托管目录，面板不会碰它。
# 由 httpd.conf 末尾追加的 IncludeOptional /www/server/apache/conf/vhost-zmind/*.conf 加载，
# 位置在宝塔 include 之后 —— 保证 443 的默认站点仍是 admin.aihabitat.live，
# 未匹配域名的行为不受影响。
#
# 行为对齐 gtd 上原 nginx 配置：不强制 80→443 跳转（Cloudflare 的
# always_use_https 是 off，且 CF 到源站走 443），两个端口都直接反代。
# =============================================================================

<VirtualHost *:80>
    ServerName  zmind.so
    ServerAlias www.zmind.so

    ErrorLog  "/www/wwwlogs/zmind.so-error_log"
    CustomLog "/www/wwwlogs/zmind.so-access_log" combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:4200/ timeout=3600
    ProxyPassReverse / http://127.0.0.1:4200/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

<VirtualHost *:443>
    ServerName  zmind.so
    ServerAlias www.zmind.so

    ErrorLog  "/www/wwwlogs/zmind.so-error_log"
    CustomLog "/www/wwwlogs/zmind.so-access_log" combined

    SSLEngine On
    SSLCertificateFile    /www/server/apache/conf/vhost-zmind/ssl/zmind.so/fullchain.pem
    SSLCertificateKeyFile /www/server/apache/conf/vhost-zmind/ssl/zmind.so/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder On

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 3600

    # 上传上限对齐原 nginx 的 client_max_body_size 256m
    LimitRequestBody 268435456

    # 不要让 Apache 压缩/缓冲代理响应：Next.js 的流式 RSC 载荷靠它
    SetEnv proxy-sendchunked 1
    SetEnv no-gzip 1

    ProxyPass        / http://127.0.0.1:4200/ timeout=3600
    ProxyPassReverse / http://127.0.0.1:4200/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
