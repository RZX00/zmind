# =============================================================================
# api.zmind.so —— 后端 API + 自建数据层（GoTrue / PostgREST）
#
# 三条路由，顺序不能颠倒（Apache 的 ProxyPass 按声明顺序匹配，最长前缀不会自动优先）：
#   /auth/v1/*  -> 127.0.0.1:8100  自建数据层网关 -> GoTrue
#   /rest/v1/*  -> 127.0.0.1:8100  自建数据层网关 -> PostgREST
#   /*          -> 127.0.0.1:18013 zmind 后端
#
# 这样 SUPABASE_URL 的路径形状与 supabase.com 完全一致，前端 supabase-js 只改域名。
# 注意：后端自己走 docker 内网直连网关，不经过这里——否则每次数据库查询都要绕
# 一圈 Cloudflare 再回来。
#
# SSE 是命脉：/api/agent-runs 的流式输出必须不被缓冲、不被压缩，且允许长连接。
# =============================================================================

<VirtualHost *:80>
    ServerName api.zmind.so

    ErrorLog  "/www/wwwlogs/api.zmind.so-error_log"
    CustomLog "/www/wwwlogs/api.zmind.so-access_log" combined

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /auth/v1 http://127.0.0.1:8100/auth/v1 timeout=3600
    ProxyPassReverse /auth/v1 http://127.0.0.1:8100/auth/v1
    ProxyPass        /rest/v1 http://127.0.0.1:8100/rest/v1 timeout=3600
    ProxyPassReverse /rest/v1 http://127.0.0.1:8100/rest/v1
    ProxyPass        /        http://127.0.0.1:18013/ timeout=3600
    ProxyPassReverse /        http://127.0.0.1:18013/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

<VirtualHost *:443>
    ServerName api.zmind.so

    ErrorLog  "/www/wwwlogs/api.zmind.so-error_log"
    CustomLog "/www/wwwlogs/api.zmind.so-access_log" combined

    SSLEngine On
    SSLCertificateFile    /www/server/apache/conf/vhost-zmind/ssl/api.zmind.so/fullchain.pem
    SSLCertificateKeyFile /www/server/apache/conf/vhost-zmind/ssl/api.zmind.so/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder On

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 3600

    LimitRequestBody 268435456

    # 对齐原 nginx 的 proxy_buffering off / gzip off —— agent 运行的 SSE 流
    # 一旦被缓冲或压缩，前端就要等整个响应结束才出字。
    SetEnv proxy-sendchunked 1
    SetEnv no-gzip 1
    <IfModule mod_deflate.c>
        SetEnvIfNoCase Content-Type text/event-stream no-gzip
    </IfModule>

    # --- 顺序敏感：更具体的前缀必须写在 / 之前 ---
    ProxyPass        /auth/v1 http://127.0.0.1:8100/auth/v1 timeout=3600
    ProxyPassReverse /auth/v1 http://127.0.0.1:8100/auth/v1

    ProxyPass        /rest/v1 http://127.0.0.1:8100/rest/v1 timeout=3600
    ProxyPassReverse /rest/v1 http://127.0.0.1:8100/rest/v1

    ProxyPass        /        http://127.0.0.1:18013/ timeout=3600
    ProxyPassReverse /        http://127.0.0.1:18013/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
