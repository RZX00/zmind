# =============================================================================
# realtime.zmind.so —— 画布协同 (Yjs over WebSocket)
#
# Apache 没有 nginx 那种 "设好 Upgrade 头就自动升级" 的写法，必须用
# mod_proxy_wstunnel + RewriteRule [P] 显式把 Upgrade: websocket 的请求
# 转成 ws:// 后端。已确认该模块在本机为 shared 已加载。
#
# ⚠️ 关键陷阱（实测踩到）：不能用 ProxyPass 处理非 WebSocket 流量。
# mod_proxy 的 ProxyPass 在 translate_name 阶段生效，早于 mod_rewrite 的 fixup
# 阶段，所以 `ProxyPass /` 会抢在 RewriteRule 之前接管请求，WebSocket 升级
# 那条规则永远不会被执行 —— 表现为握手返回 404（后端把它当普通 HTTP GET）。
# 正确做法：两种流量都走 RewriteRule [P]，彻底不用 ProxyPass。
# ProxyPassReverse 可以保留，它只改响应头、不认领请求。
# =============================================================================

<VirtualHost *:80>
    ServerName realtime.zmind.so

    ErrorLog  "/www/wwwlogs/realtime.zmind.so-error_log"
    CustomLog "/www/wwwlogs/realtime.zmind.so-access_log" combined

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:6020/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/?(.*) http://127.0.0.1:6020/$1 [P,L]

    ProxyPassReverse / http://127.0.0.1:6020/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

<VirtualHost *:443>
    ServerName realtime.zmind.so

    ErrorLog  "/www/wwwlogs/realtime.zmind.so-error_log"
    CustomLog "/www/wwwlogs/realtime.zmind.so-access_log" combined

    SSLEngine On
    SSLCertificateFile    /www/server/apache/conf/vhost-zmind/ssl/realtime.zmind.so/fullchain.pem
    SSLCertificateKeyFile /www/server/apache/conf/vhost-zmind/ssl/realtime.zmind.so/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder On

    ProxyPreserveHost On
    ProxyRequests Off
    # 协同连接是长连接，超时必须放宽，否则每小时被切一次
    ProxyTimeout 3600

    LimitRequestBody 268435456
    SetEnv proxy-sendchunked 1
    SetEnv no-gzip 1

    # 两类流量都走 RewriteRule [P]：见文件头注释，用 ProxyPass 会让升级规则失效
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:6020/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/?(.*) http://127.0.0.1:6020/$1 [P,L]

    ProxyPassReverse / http://127.0.0.1:6020/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
