<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
{% if style.font_import %}
<link rel="stylesheet" href="{{ style.font_import }}">
{% endif %}
{% if style.font_body_import and style.font_body_import != style.font_import %}
<link rel="stylesheet" href="{{ style.font_body_import }}">
{% endif %}
<style>
:root {
  --primary: {{ style.primary_color }};
  --accent: {{ style.accent_color }};
  --bg: {{ style.background }};
  --text: {{ style.text_color }};
  --font-heading: {{ style.font_family }};
  --font-body: {{ style.font_body | default(style.font_family) }};
  --heading-weight: {{ style.heading_weight | default('700') }};
  --body-weight: {{ style.body_weight | default('400') }};
  --slide-count: {{ slide_count }};
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: var(--body-weight);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Slide Container ===== */
.deck { position: relative; width: 100%; height: 100%; }

.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: 4.5% 6%;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.45s;
  overflow: hidden;
}

.slide.active {
  opacity: 1;
  visibility: visible;
}

/* ===== Typography ===== */
.slide-title {
  font-family: var(--font-heading);
  font-weight: var(--heading-weight);
  font-size: clamp(1.6rem, 3.2vw, 2.8rem);
  line-height: 1.2;
  color: var(--primary);
  margin-bottom: 0.6em;
}

.slide-subtitle {
  font-family: var(--font-body);
  font-size: clamp(0.95rem, 1.6vw, 1.35rem);
  line-height: 1.5;
  opacity: 0.72;
  margin-bottom: 1em;
}

.slide-content {
  font-size: clamp(0.9rem, 1.4vw, 1.15rem);
  line-height: 1.7;
  flex: 1;
}

.slide-points {
  list-style: none;
  padding: 0;
  flex: 1;
}

.slide-points li {
  position: relative;
  padding-left: 1.6em;
  margin-bottom: 0.7em;
  font-size: clamp(0.9rem, 1.4vw, 1.15rem);
  line-height: 1.65;
}

.slide-points li::before {
  content: '';
  position: absolute;
  left: 0; top: 0.55em;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

/* ===== Layout: Two-Column ===== */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5%;
  flex: 1;
  align-items: start;
}

.col-heading {
  font-family: var(--font-heading);
  font-weight: var(--heading-weight);
  font-size: clamp(1rem, 1.8vw, 1.4rem);
  color: var(--primary);
  margin-bottom: 0.6em;
}

/* ===== Layout: Image + Text ===== */
.img-text-row {
  display: grid;
  gap: 5%;
  flex: 1;
  align-items: center;
}

.img-text-row.img-left  { grid-template-columns: 42% 1fr; }
.img-text-row.img-right { grid-template-columns: 1fr 42%; }

.slide-image {
  width: 100%; height: 100%;
  max-height: 70vh;
  object-fit: cover;
  border-radius: 8px;
}

.image-placeholder {
  width: 100%; height: 100%;
  min-height: 180px;
  background: color-mix(in srgb, var(--primary) 8%, transparent);
  border: 2px dashed color-mix(in srgb, var(--primary) 25%, transparent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; opacity: 0.5;
}

/* ===== Layout: Title Slide ===== */
.slide--title {
  justify-content: center;
  align-items: center;
  text-align: center;
}

.slide--title .slide-title {
  font-size: clamp(2.2rem, 4.5vw, 3.8rem);
  margin-bottom: 0.3em;
}

.slide--title .slide-subtitle {
  font-size: clamp(1.05rem, 1.8vw, 1.5rem);
  max-width: 70%;
}

/* ===== Layout: Closing Slide ===== */
.slide--closing {
  justify-content: center;
  align-items: center;
  text-align: center;
}

.slide--closing .slide-title {
  font-size: clamp(2rem, 4vw, 3.2rem);
  margin-bottom: 0.3em;
}

/* ===== Layout: Quote ===== */
.slide--quote {
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 8% 12%;
}

.quote-mark {
  font-size: 4rem;
  line-height: 1;
  color: var(--accent);
  opacity: 0.5;
  margin-bottom: 0.2em;
}

.quote-text {
  font-family: var(--font-heading);
  font-size: clamp(1.3rem, 2.4vw, 2rem);
  font-style: italic;
  line-height: 1.5;
  max-width: 80%;
  margin: 0 auto 1em;
}

.quote-author {
  font-size: clamp(0.85rem, 1.2vw, 1.05rem);
  opacity: 0.65;
}

.quote-author::before { content: '— '; }

/* ===== Layout: Data ===== */
.data-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 2rem;
  flex: 1;
  align-content: center;
}

.data-card {
  text-align: center;
  padding: 1.5rem;
}

.data-value {
  font-family: var(--font-heading);
  font-weight: var(--heading-weight);
  font-size: clamp(2rem, 4vw, 3.2rem);
  color: var(--accent);
  line-height: 1.15;
}

.data-label {
  font-size: clamp(0.9rem, 1.3vw, 1.1rem);
  font-weight: 600;
  margin-top: 0.4em;
}

.data-desc {
  font-size: clamp(0.78rem, 1vw, 0.9rem);
  opacity: 0.6;
  margin-top: 0.25em;
}

/* ===== Layout: Timeline ===== */
.timeline {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  flex: 1;
  justify-content: center;
  padding: 0 2%;
}

.timeline-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}

.timeline-dot {
  flex-shrink: 0;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 0.3em;
  position: relative;
}

.timeline-item:not(:last-child) .timeline-dot::after {
  content: '';
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  width: 2px; height: calc(1.2rem + 1.2em);
  background: color-mix(in srgb, var(--accent) 30%, transparent);
}

.timeline-label {
  font-family: var(--font-heading);
  font-weight: var(--heading-weight);
  font-size: clamp(0.95rem, 1.4vw, 1.15rem);
  color: var(--primary);
}

.timeline-desc {
  font-size: clamp(0.82rem, 1.1vw, 0.95rem);
  opacity: 0.7;
  margin-top: 0.15em;
}

/* ===== Layout: Team ===== */
.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1.5rem;
  flex: 1;
  align-content: center;
}

.team-card {
  text-align: center;
  padding: 1.2rem 0.8rem;
}

.team-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-heading);
  font-size: 1.4rem;
  font-weight: var(--heading-weight);
  margin: 0 auto 0.6rem;
}

.team-name {
  font-family: var(--font-heading);
  font-weight: var(--heading-weight);
  font-size: clamp(0.9rem, 1.2vw, 1.05rem);
}

.team-role {
  font-size: clamp(0.78rem, 1vw, 0.88rem);
  color: var(--accent);
  margin-top: 0.15em;
}

.team-desc {
  font-size: clamp(0.75rem, 0.9vw, 0.82rem);
  opacity: 0.6;
  margin-top: 0.3em;
}

/* ===== Progress Bar ===== */
.progress-bar {
  position: fixed; bottom: 0; left: 0;
  height: 3px;
  background: var(--accent);
  transition: width 0.35s ease;
  z-index: 100;
}

/* ===== Page Indicator ===== */
.page-indicator {
  position: fixed; bottom: 12px; right: 20px;
  font-size: 0.78rem;
  opacity: 0.45;
  font-variant-numeric: tabular-nums;
  z-index: 100;
  pointer-events: none;
}

/* ===== Fullscreen Toggle ===== */
.fullscreen-btn {
  position: fixed; bottom: 10px; left: 20px;
  background: none; border: none;
  cursor: pointer; opacity: 0.35;
  color: var(--text);
  font-size: 1.1rem;
  z-index: 100;
  transition: opacity 0.2s;
}
.fullscreen-btn:hover { opacity: 0.8; }

/* ===== Speaker Notes Panel ===== */
.speaker-notes {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  max-height: 30vh;
  background: rgba(0,0,0,0.92);
  color: #e5e5e5;
  padding: 1rem 2rem;
  font-size: 0.88rem;
  line-height: 1.6;
  overflow-y: auto;
  z-index: 200;
  border-top: 2px solid var(--accent);
}

.speaker-notes.visible { display: block; }

.speaker-notes-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.5;
  margin-bottom: 0.4rem;
}

/* ===== Print ===== */
@media print {
  html, body { overflow: visible; height: auto; }
  .slide {
    position: relative; opacity: 1; visibility: visible;
    page-break-after: always;
    min-height: 100vh;
  }
  .progress-bar, .page-indicator, .fullscreen-btn, .speaker-notes { display: none !important; }
}
</style>
</head>
<body>

<div class="deck" id="deck">
  {% for slide in slides %}
  <section class="slide slide--{{ slide.layout }}{% if loop.first %} active{% endif %}"
           data-slide="{{ loop.index }}"
           data-notes="{{ slide.speaker_notes | default('') | e }}">
    {% include slide.layout_template %}
  </section>
  {% endfor %}
</div>

<div class="progress-bar" id="progressBar" style="width: {{ (1 / slide_count * 100) | round(1) }}%"></div>
<div class="page-indicator" id="pageIndicator">1 / {{ slide_count }}</div>
<button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen (F)">&#x26F6;</button>
<div class="speaker-notes" id="speakerNotes">
  <div class="speaker-notes-label">Speaker Notes</div>
  <div id="speakerNotesContent"></div>
</div>

<script>
(function(){
  const deck = document.getElementById('deck');
  const slides = deck.querySelectorAll('.slide');
  const total = slides.length;
  const bar = document.getElementById('progressBar');
  const indicator = document.getElementById('pageIndicator');
  const notesPanel = document.getElementById('speakerNotes');
  const notesContent = document.getElementById('speakerNotesContent');
  let current = 0;
  let notesVisible = false;

  function go(idx) {
    if (idx < 0 || idx >= total) return;
    slides[current].classList.remove('active');
    current = idx;
    slides[current].classList.add('active');
    bar.style.width = ((current + 1) / total * 100).toFixed(1) + '%';
    indicator.textContent = (current + 1) + ' / ' + total;
    var n = slides[current].getAttribute('data-notes') || '';
    notesContent.textContent = n;
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault(); go(current + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault(); go(current - 1);
    } else if (e.key === 'Home') {
      e.preventDefault(); go(0);
    } else if (e.key === 'End') {
      e.preventDefault(); go(total - 1);
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault(); toggleFullscreen();
    } else if (e.key === 's' || e.key === 'S') {
      e.preventDefault();
      notesVisible = !notesVisible;
      notesPanel.classList.toggle('visible', notesVisible);
    }
  });

  /* Touch swipe */
  let touchX = 0;
  deck.addEventListener('touchstart', function(e){ touchX = e.changedTouches[0].clientX; }, {passive: true});
  deck.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) { dx < 0 ? go(current + 1) : go(current - 1); }
  }, {passive: true});

  /* Click navigation: left third = prev, right third = next */
  deck.addEventListener('click', function(e){
    if (e.target.closest('a, button, input, textarea, select')) return;
    var rect = deck.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width;
    if (x < 0.3) go(current - 1);
    else if (x > 0.7) go(current + 1);
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen().catch(function(){});
    }
  }
  document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
})();
</script>
</body>
</html>
