<h2 class="slide-title">{{ slide.title }}</h2>
{% if slide.subtitle %}
<p class="slide-subtitle">{{ slide.subtitle }}</p>
{% endif %}
{% if slide.points %}
<ul class="slide-points">
  {% for point in slide.points %}
  <li>{{ point }}</li>
  {% endfor %}
</ul>
{% elif slide.content %}
<div class="slide-content">{{ slide.content }}</div>
{% endif %}
